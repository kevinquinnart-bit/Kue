name: KueVault

# Every push to this branch: test, build, and put the app on the "kuevault" download.
on:
  push:
    branches: [ kuevault ]
    # KueVault Shrink (the PC program) has its own build.
    paths-ignore: [ 'pc/**', '.github/workflows/kuevault-shrink.yml' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuevault-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v6

      # The signing key is kept locked in the project. The password is in GitHub's hidden settings
      # (KUE_SIGNING_KEY), so only these builds can unlock it.
      - name: Unlock the signing key
        env:
          KUE_SIGNING_KEY: ${{ secrets.KUE_SIGNING_KEY }}
        run: |
          if [ -z "$KUE_SIGNING_KEY" ]; then echo "KUE_SIGNING_KEY is missing from the project's hidden settings"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KUE_SIGNING_KEY -in app/signing/kuevault.jks.enc -out app/signing/kuevault.jks

      - name: Test
        run: |
          chmod +x ./gradlew
          # Tried twice: a download from Maven sometimes fails on the first go.
          ./gradlew :app:testDirectDebugUnitTest --stacktrace || ./gradlew :app:testDirectDebugUnitTest --stacktrace || {
            # Which tests failed, as notes on the run, readable without signing in.
            for f in app/build/test-results/testDirectDebugUnitTest/*.xml; do
              grep -q "<failure" "$f" || continue
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for fail in case.findall("failure"):
                  text = (fail.get("message") or "")[:300].replace("\n", " ").replace("%", "%25")
                  print("::error title=" + case.get("classname", "") + "." + case.get("name", "") + "::" + text)
          PY
            done
            echo "::error title=Test::the tests didn't run to the end; see the log"
            exit 1
          }

      - name: Build
        run: |
          # The download (updates itself), and the Google Play version as the bundle the store takes.
          ./gradlew :app:assembleDirectRelease :app:bundlePlayRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/direct/release/app-direct-universal-release.apk dist/KueVault.apk
          # Each kind of chip's own half, which updates download.
          for abi in armeabi-v7a arm64-v8a; do cp app/build/outputs/apk/direct/release/app-direct-$abi-release.apk dist/KueVault-$abi.apk; done
          ls -l dist
          cp app/build/outputs/bundle/playRelease/app-play-release.aab dist/KueVault-play.aab
          printf 'KueVault, version %s\n' "$VERSION_NAME" > dist/NOTES.md
          # What the app reads each time it opens, to know whether a newer version is waiting.
          printf 'code=%s\nname=%s\n' "$VERSION_CODE" "$VERSION_NAME" > dist/version.txt

      # make_latest stays false: the TV's Downloader code for KueTV fetches the project's "latest" download,
      # which must always be KueTV's.
      # The app first, then version.txt, which tells phones a new version is there: sent together, version.txt
      # could arrive first and a phone asking then would get the old app (seen on KueTV, 20 Nov 2026).
      - name: Publish the app
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kuevault
          target_commitish: ${{ github.sha }}
          name: KueVault (${{ env.VERSION_NAME }})
          files: |
            dist/KueVault.apk
            dist/KueVault-armeabi-v7a.apk
            dist/KueVault-arm64-v8a.apk
            dist/KueVault-play.aab
          body_path: dist/NOTES.md
          prerelease: false
          make_latest: false

      - name: Publish the version number
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kuevault
          target_commitish: ${{ github.sha }}
          name: KueVault (${{ env.VERSION_NAME }})
          files: dist/version.txt
          body_path: dist/NOTES.md
          prerelease: false
          make_latest: false
