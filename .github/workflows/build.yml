name: KueTV

# Every push to main: test, build, and put the app on the "kuetv" download.
on:
  push:
    branches: [ trial ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuetv-trial
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 0.1.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
      KUETV_DRIVE_CLIENT_ID: ${{ secrets.KUETV_DRIVE_CLIENT_ID }}
      KUETV_DRIVE_CLIENT_SECRET: ${{ secrets.KUETV_DRIVE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v6

      # The signing key is kept locked in the project. The password is in GitHub's hidden settings
      # (KUE_SIGNING_KEY), so only these builds can unlock it.
      - name: Unlock the signing key
        env:
          KUE_SIGNING_KEY: ${{ secrets.KUE_SIGNING_KEY }}
        run: |
          if [ -z "$KUE_SIGNING_KEY" ]; then echo "KUE_SIGNING_KEY is missing from the project's hidden settings"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KUE_SIGNING_KEY -in app/signing/kuetv.jks.enc -out app/signing/kuetv.jks

      - name: Test
        run: |
          chmod +x ./gradlew
          # Tried twice: Robolectric's Android download from Maven sometimes fails on the first go.
          ./gradlew :app:testDebugUnitTest --stacktrace || ./gradlew :app:testDebugUnitTest --stacktrace || {
            # Which tests failed, as notes on the run, readable without signing in.
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              grep -q "<failure" "$f" || continue
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for fail in case.findall("failure"):
                  text = (fail.get("message") or "")[:300].replace("\n", " ").replace("%", "%25")
                  print("::error title=" + case.get("classname", "") + "." + case.get("name", "") + "::" + text)
          PY
            done
            exit 1
          }

      - name: Build
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/KueTV.apk
          # Each kind of chip's own half, which updates download.
          for abi in armeabi-v7a arm64-v8a; do cp app/build/outputs/apk/release/app-$abi-release.apk dist/KueTV-$abi.apk; done
          ls -l dist
          # A copy for apps up to 0.1.156, which check the old "kuetv2" download.
          cp dist/KueTV.apk dist/KueTV2.apk
          printf 'KueTV, version %s\n' "$VERSION_NAME" > dist/NOTES.md
          # What the app reads each time it opens, to know whether a newer version is waiting.
          printf 'code=%s\nname=%s\n' "$VERSION_CODE" "$VERSION_NAME" > dist/version.txt
          echo "Torrent engine in this build:"; unzip -l dist/KueTV.apk | grep '\.so$' || echo "MISSING"
          # The VPN engine loads each of these by name; a build without any one of them is not published.
          for abi in armeabi-v7a arm64-v8a; do
            for lib in libopenvpn.so libovpnexec.so libovpnutil.so libosslutil.so libosslspeedtest.so libovpn3.so; do
              unzip -l dist/KueTV.apk | grep -q "lib/$abi/$lib" || { echo "VPN engine part missing: $abi/$lib"; exit 1; }
              unzip -l dist/KueTV-$abi.apk | grep -q "lib/$abi/$lib" || { echo "VPN engine part missing from the $abi half: $lib"; exit 1; }
            done
          done
          echo "VPN engine in this build: all parts, for both kinds of chip"
          if [ -n "$KUETV_DRIVE_CLIENT_ID" ] && [ -n "$KUETV_DRIVE_CLIENT_SECRET" ]; then echo "Google Drive keys: in this build"; else echo "Google Drive keys: MISSING from this build"; fi

      - name: Publish the trial
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kuetv-trial
          target_commitish: ${{ github.sha }}
          name: KueTV trial (${{ env.VERSION_NAME }})
          files: |
            dist/KueTV-armeabi-v7a.apk
          body_path: dist/NOTES.md
          prerelease: true
          make_latest: false
